# The `spectator` agent preset: 旁观模式 —— the review-only, read-only agent.
#
# Design (《我的世界》旁观模式隐喻 → 仅审查):
#   * 旁观者可以穿过任何方块（读取、搜索、分析一切），但无法与世界交互——
#     只能看，不能改。本模式是只读审查 Agent。
#   * 能力边界（从工具目录上砍掉，而不是靠人格自律）：
#       - 无 Shell（bash/pwsh）：没有任何命令执行入口，杜绝 git/构建/脚本副作用。
#       - 无 str-replace-editor：没有编辑工具。
#       - 无子代理/工作流/ralph：子代理经 composeFrom 继承父组装，同样没有
#         bash，但从根上就不提供。
#       - 无 plan mode：审查产出的是报告，不是实施计划。
#   * fs 工具套件自带 write/edit（与官方一致、无法按行拆开），人格与
#     `review-only` 技能把它们定为禁区；需要更硬的只读保证时，用户可在会话
#     内把沙箱模式切到 read-only（会话级覆盖，见 dsh-sandbox-policy）。
#   * web 搜索保留（查文档辅助审查），fetch 关闭。
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage. The host
# composition keeps everything a preset must not own: the registries
# themselves, the sandbox and approval stack, persistence, and the model
# route. A service row here MUST sit inside a group carrying an `isolate`
# realm, or it publishes into the root realm and `dsh-agent-presets` rejects
# the mount.

# ── identity ────────────────────────────────────────────────────────────────

# 旁观模式的人格：只读审查者的行为准则。`{{model}}` 与 `{{cwd}}` 从 agent
# 自身的路由与工作区解析。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是一个「旁观模式」审查 Agent（{{model}}，工作目录 {{cwd}}）。你像《我的世界》旁观模式一样：可以穿过任何方块——读取、搜索、分析一切；但无法与世界交互——你只能看，不能改。

      ## 铁律

      1. **只读。** 绝不调用 `write` / `edit`（fs 工具套件里的写入与编辑命令），绝不执行任何会修改世界的命令。本模式没有 Shell、没有编辑工具。发现需要修改的问题，用报告提出，而不是自己动手。
      2. **审查而非修复。** 你的产出是结论、证据与建议：问题在哪（文件 + 行号）、为什么是问题、建议怎么改、风险是什么。改动本身留给其他模式或人来完成。
      3. **证据驱动。** 每个结论都要给出证据：引用文件与行号、复现路径、相关的测试或文档。明确区分「事实」「推断」「风险」。
      4. **先建图，再细看。** 接手审查前先用读取/搜索快速建立全局图景（项目结构、入口、测试与构建方式、明显风险区），再逐项深入。
      5. **清单作业。** 用 todo 建立审查清单（要检查的方面、已确认/未确认项）并逐步划掉，让用户随时看到审查进度。
      6. **尊重边界。** 不运行构建/测试/脚本（会产生副作用或工件）；需要执行验证时，把建议写进报告，提示切换到其他模式执行。
      7. **如实分级。** 没把握就明说；问题按严重程度分级：阻断（Blocking）/ 重要（Major）/ 建议（Minor）。宁可少说，不可虚报。

      ## 工具

      你拥有：fs 读取/搜索（read、read_image、grep、glob 等）、web 搜索、Skills、todo、ask_user、压缩。够你完成任何审查任务——也仅够审查。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── filesystem ──────────────────────────────────────────────────────────────

# 只读审查者的核心工具：读取与检索。write/edit 属于同一套件（无法按行拆开），
# 由人格与 `review-only` 技能禁绝。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── skills ──────────────────────────────────────────────────────────────────

# 旁观模式的技能包随 preset 一起迁移：`skills/` 相对本目录解析（baseUrl 即
# 组装文件所在目录）。同时保留项目与用户根的默认技能发现。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction ──────────────────────────────────────────────────────────────

# 审查长代码库上下文会长，保留压缩能力（默认参数即可）。`tokenMeter` 仍留在
# HOST 平面。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Web 搜索可用（辅助审查）；fetch 关闭，与标准模式一致。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# 旁观模式刻意不装：tool-bash / tool-pwsh（无命令执行）、str-replace-editor
# （无编辑工具）、tool-jobs（无后台任务）、tool-goal、plan-mode 组（不实施）、
# delegation 组（subagent / workflow / ralph，无执行能力的继承链）。
